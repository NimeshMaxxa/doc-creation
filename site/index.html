<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<title>FFS Invoice Desk</title>
<style>
:root { --bg: #f3f4f7; --panel: #fff; --fg: #1d2330; --muted: #5d6577; --line: #d9dce4; --field: #f8f9fb; --accent: #c8231b; --accent-fg: #fff; --focus: #2f6fdb; }
@media (prefers-color-scheme: dark) { :root { --bg: #14161c; --panel: #1c1f27; --fg: #e7e9ef; --muted: #9aa1b2; --line: #2e333f; --field: #232733; --accent: #ef5a4f; --accent-fg: #1a0b0a; --focus: #6a9cf0; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; display: grid; place-items: center; padding-inline: 16px; }
form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 28px 24px; display: grid; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 44px; height: 44px; }
h1 { font-size: 18px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
label { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=password], input[type=text] { font: inherit; width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 5px; background: var(--field); color: var(--fg); }
input:focus, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
.remember { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); font-weight: 400; }
button { font: inherit; font-weight: 600; border: 0; border-radius: 5px; padding: 10px; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.err { color: var(--accent); font-size: 13px; min-height: 1em; margin: 0; }
</style>
</head>
<body>
<form id="gate" autocomplete="on">
  <div class="brand"><img src="logo.png" alt=""><div><h1>FFS Invoice Desk</h1><div class="sub">Fire Fighting Solutions (Pvt) Ltd</div></div></div>
  <div style="display:grid;gap:6px">
    <label for="user">Username</label>
    <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  </div>
  <div style="display:grid;gap:6px">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
  </div>
  <label class="remember"><input type="checkbox" id="remember" checked> Keep me signed in on this device</label>
  <button id="go" type="submit">Open</button>
  <p class="err" id="err" role="alert"></p>
</form>

const KEY_STORE = "ffs-site-key";
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
async function deriveKey(user, pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(user.trim().toLowerCase() + "\n" + pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function openWith(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(P.iv) }, key, unb64(P.data));
  const html = new TextDecoder().decode(plain);
  // replace the page only once the login page has fully loaded, otherwise the browser
  // adds the form below the login box instead of replacing it
  if (document.readyState !== "complete") await new Promise((r) => addEventListener("load", r, { once: true }));
  document.open(); document.write(html); document.close();
}
(async () => {
  try {
    const saved = localStorage.getItem(KEY_STORE);
    if (saved) {
      const { salt, raw } = JSON.parse(saved);
      if (salt === P.salt) { await openWith(await crypto.subtle.importKey("raw", unb64(raw), "AES-GCM", false, ["decrypt"])); return; }
      localStorage.removeItem(KEY_STORE);
    }
  } catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (_) {} }
})();
document.getElementById("gate").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = ""; btn.textContent = "Checking…";
  try {
    const key = await deriveKey(document.getElementById("user").value, document.getElementById("pw").value);
    let ok = false;
    try { await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(P.iv) }, key, unb64(P.data)); ok = true; } catch (_) {}
    if (!ok) { err.textContent = "That username or password isn't right. Try again."; return; }
    if (document.getElementById("remember").checked) {
      try { localStorage.setItem(KEY_STORE, JSON.stringify({ salt: P.salt, raw: b64(await crypto.subtle.exportKey("raw", key)) })); } catch (_) {}
    }
    await openWith(key);
  } finally { btn.disabled = false; btn.textContent = "Open"; }
});
})();
